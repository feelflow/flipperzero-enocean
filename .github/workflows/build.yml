name: Build FAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ufbt (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: momentum
            index: https://up.momentum-fw.dev/firmware/directory.json
          - name: official
            index: https://update.flipperzero.one/firmware/directory.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: pip install ufbt

      - name: Install SDK
        run: ufbt update --index-url=${{ matrix.index }} -c release

      - name: Build
        run: ufbt

      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: enocean_rx-${{ matrix.name }}
          path: dist/*.fap

      - name: Publish Momentum build to the builds branch
        if: matrix.name == 'momentum' && github.event_name == 'push'
        run: |
          cp dist/enocean_rx.fap /tmp/enocean_rx.fap
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf -q .
          cp /tmp/enocean_rx.fap ./enocean_rx.fap
          git add enocean_rx.fap
          git commit -q -m "Momentum build of ${GITHUB_SHA}"
          git push --force origin builds
